# Test service override - use with: docker compose -f compose.yml -f compose.test.yml
services:
  test:
    build:
      context: ../../backend
      dockerfile: dockerfile.test

    working_dir: /app

    environment:
      - ENVIRONMENT=test

    entrypoint: /bin/bash
    command: -c "ENVIRONMENT=test pytest -v"

    volumes:
      # Mount source for live code changes during test development
      - ../../backend/src:/backend/src:z
      - ../../tests:/app/tests:z
      - ../../pytest.ini:/app/pytest.ini:z
      - ../../data-test:/data:z

    depends_on:
      - redis
      - qdrant

  # Override qdrant to use test data directory
  qdrant:
    volumes:
      - ../../data-test/qdrant:/qdrant/storage:z
