name: voogle

x-defaults: &defaults
  logging:
    driver: "json-file"
    options:
      max-file: 5
      max-size: 10m
  restart: unless-stopped

services:
  backend:
    <<: *defaults
    image: voogle-api:latest
    build:
      context: ../../backend
      dockerfile: dockerfile.api
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - EMBEDDINGS_PROVIDER_OVERRIDE=local
    ports:
      - "8081:80"
    command: uvicorn src.voogle.main:app --reload --reload-dir /backend/src --host 0.0.0.0 --port 80
    volumes:
      - ../../backend/:/backend/
      - ../../data/:/data/
    healthcheck:
      test: ["CMD", "curl", "-f", "0.0.0.0/app/version"]
      interval: 6s
      timeout: 10s
      retries: 50

  frontend:
    <<: *defaults
    image: voogle-ui:latest
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:5173"
    build:
      context: ../../frontend
      dockerfile: dockerfile.dev
    environment:
      # VITE environment variables for API URL configuration
      # Empty values = use Vite proxy (relative /api URLs), avoiding CORS/PNA issues
      - VITE_API_HOST=${VITE_API_HOST}
      - VITE_API_PORT=${VITE_API_PORT}
      - VITE_API_PREFIX=${VITE_API_PREFIX}
      # Backend target for Vite proxy (Docker service hostname)
      - VITE_BACKEND_TARGET=http://backend:80
    volumes:
      - ../../frontend/src:/frontend/src
      - ../../frontend/public:/frontend/public
    healthcheck:
      test: ["CMD", "curl", "-f", "0.0.0.0:5173"]
      interval: 6s
      timeout: 10s
      retries: 50

  management:
    <<: *defaults
    image: voogle-management:latest
    build:
      context: ../../backend
      dockerfile: dockerfile.management
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8580:8501"
    command: streamlit run src/voogle/management/🏠-Home.py
    volumes:
      - ../../backend/:/backend/
      - ../../data/:/data/

  redis:
    <<: *defaults
    image: redis:7.0.4-alpine
    hostname: ${REDIS_HOST}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  worker:
    <<: *defaults
    image: voogle-worker:latest
    depends_on:
      redis:
        condition: service_healthy
    build:
      context: ../../backend
      dockerfile: dockerfile.worker
    env_file:
      - .env
    environment:
      # Persist ML model downloads across container restarts
      - HF_HOME=/data/.cache/huggingface
    command: python src/voogle/worker.py
    volumes:
      - ../../backend/:/backend/
      - ../../data/:/data/

  qdrant:
    <<: *defaults
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - ../../data/qdrant/:/qdrant/storage
    stop_grace_period: 30s  # Give Qdrant time to flush data to disk on shutdown
