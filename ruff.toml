target-version = "py39"
line-length = 120

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations - catches missing type hints!
    "ARG",  # flake8-unused-arguments - catches unused parameters!
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "RUF",  # Ruff-specific rules
]

ignore = [
    "ANN002",  # Missing type annotation for *args
    "ANN003",  # Missing type annotation for **kwargs
]

[lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG001",  # Allow unused fixture arguments in tests (like aiolib)
]
"backend/src/voogle/routers/*.py" = [
    "B008",    # FastAPI Depends() in defaults is the correct pattern
    "ARG001",  # FastAPI dependency injection params (admin) are intentionally unused
]
"backend/src/voogle/auth.py" = [
    "B008",    # FastAPI Depends() in defaults is the correct pattern
]
"backend/src/voogle/management/**/*.py" = [
    "N999",    # Streamlit uses emoji in page filenames by design
    "RUF001",  # Emoji in markdown/docstrings is intentional
]
"backend/src/voogle/adapters/audio.py" = [
    "ANN401",  # Any type used for faster-whisper internal types (lazy-loaded)
]

[lint.flake8-annotations]
suppress-none-returning = false  # Require -> None even for fixtures
