name: Voogle CI

on:
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  CI_IMAGE: ghcr.io/${{ github.repository }}-ci:latest

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linting tools
        run: pip install ruff pyright

      - name: Run ruff
        run: ruff check .
        working-directory: backend

      - name: Run pyright
        run: pyright src/
        working-directory: backend

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI image (or build if not exists)
        run: |
          docker pull ${{ env.CI_IMAGE }} || \
          docker build -t ${{ env.CI_IMAGE }} -f tests/dockerfile .

      - name: Run tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e VOOGLE_ENVIRONMENT=test \
            -e VOOGLE_DATA_DIR=/tmp/voogle-test \
            -e PYTHONPATH=/workspace/tests \
            ${{ env.CI_IMAGE }} \
            pytest tests/ -v --ignore=tests/e2e
