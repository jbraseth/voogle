name: Voogle CI

on:
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-test

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=

      - name: Build and push test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: tests/dockerfile
          target: test
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: read
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run ruff
        run: docker run --rm ${{ needs.build.outputs.image }} ruff check .

      - name: Run pyright
        run: docker run --rm ${{ needs.build.outputs.image }} pyright src/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: read
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: |
          docker run --rm \
            -e VOOGLE_ENVIRONMENT=test \
            -e VOOGLE_DATA_DIR=/tmp/voogle-test \
            ${{ needs.build.outputs.image }} pytest /tests -v
