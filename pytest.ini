[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Tests for pure functions and isolated logic without external dependencies
    component: Tests for specific modules/components in isolation
    integration: Tests that integrate multiple components (API + DB + services)
    e2e: Tests for complete user workflows through the UI (browser-based)
    description(summary): Short summary of what the test validates

# Test output
junit_family = xunit2
junit_logging = all
addopts = --junit-xml=tests/test_results/test-results.xml

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore:the imp module is deprecated:DeprecationWarning

# Environment
env =
    ENVIRONMENT=test
