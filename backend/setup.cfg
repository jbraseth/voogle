[metadata]
name = voogle
version = 1.0.0
url = https://github.com/jbraseth/voogle
author = Pablo González Carrizo (unmonoqueteclea)
author_email = pgonzalezcarrizo@gmail.com
maintainer = Josh Braseth
maintainer_email = holyspirit.dev@gmail.com
description = voogle
long_description = file: readme.md

[options]
package_dir=
    =src
packages=find:
include_package_data = True
python_requires = >=3.12, <4
install_requires =
    fastapi[all]>=0.115.0,<1
    fastapi-pagination>=0.12.0,<1
    xmltodict>=0.14.0,<1
    ormar>=0.20.0,<0.21.0
    alembic>=1.14.0,<2
    aiosqlite>=0.20.0
    python-jose[cryptography]>=3.3.0,<4
    passlib[bcrypt]>=1.7.4,<2
    rq>=2.0.0,<3
    python-dateutil>=2.9.0,<3
    sentence-transformers>=3.0.0,<6
    qdrant-client>=1.12.0,<2
    faster-whisper>=1.0.0,<2
    streamlit>=1.41.0,<2
    openai>=1.50.0,<3
    tenacity>=9.0.0,<10

[options.packages.find]
where=src

[options.package_data]
* = urls.json

[options.entry_points]
console_scripts =
    voogle-episodes = voogle.cli.episodes:main
    voogle-management = voogle.cli.management:main
    voogle-search = voogle.cli.search:main

[options.extras_require]
dev =
    ruff
    pytest
    pytest-asyncio
    pytest-env
    pytest-cov
    pytest-xdist
    pytest-timeout
    pytest-mock
    pyright