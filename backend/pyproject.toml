[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations - catches missing type hints!
    "ARG",  # flake8-unused-arguments - catches unused parameters!
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "RUF",  # Ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG001",  # Allow unused fixture arguments in tests (like aiolib)
]
"src/voogle/routers/*.py" = [
    "B008",    # FastAPI Depends() in defaults is the correct pattern
    "ARG001",  # FastAPI dependency injection params (admin) are intentionally unused
]
"src/voogle/auth.py" = [
    "B008",    # FastAPI Depends() in defaults is the correct pattern
]
"src/voogle/management/**/*.py" = [
    "N999",    # Streamlit uses emoji in page filenames by design
    "RUF001",  # Emoji in markdown/docstrings is intentional
]

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = false  # Require -> None even for fixtures
