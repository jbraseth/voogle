[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "unit: Tests for pure functions and isolated logic without external dependencies",
    "component: Tests for specific modules/components in isolation",
    "integration: Tests that integrate multiple components (API + DB + services)",
    "e2e: Tests for complete user workflows through the UI (browser-based)",
]
# set this to true if you need to debug something in the tests
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
# filter a deprecation warning raised by a Tensorflow dependency
filterwarnings = ["ignore:the imp module is deprecated:DeprecationWarning"]

# using pytest-env plugin
env = ["ENVIRONMENT=test"]