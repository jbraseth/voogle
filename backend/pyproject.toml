[project]
name = "voogle"
version = "1.0.0"
description = "Semantic search engine for podcasts and audio content"
requires-python = ">=3.12"
authors = [
    { name = "Pablo González Carrizo (unmonoqueteclea)", email = "pgonzalezcarrizo@gmail.com" },
]
maintainers = [
    { name = "Josh Braseth", email = "holyspirit.dev@gmail.com" },
]

dependencies = [
    # Core web framework
    "fastapi[all]>=0.115.0,<1",
    "fastapi-pagination>=0.12.0,<1",
    "uvicorn>=0.34.0,<1",
    "starlette>=0.41.0,<1",
    "pydantic>=2.8.0,<3",
    "pydantic-settings>=2.6.0,<3",

    # Database
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0,<2",
    "databases>=0.7.0,<0.8.0",
    "ormar>=0.20.0,<0.21.0",
    "SQLAlchemy>=1.4.0,<2.0.0",

    # Authentication
    "python-jose[cryptography]>=3.3.0,<4",
    "passlib[bcrypt]>=1.7.4,<2",
    "cryptography>=44.0.0",
    "bcrypt>=4.2.0,<5",

    # Task queue
    "redis>=5.2.0,<6",
    "rq>=2.0.0,<3",

    # XML/Data processing
    "xmltodict>=0.14.0,<1",
    "python-dateutil>=2.9.0,<3",

    # LLM API (not local ML - just API client)
    "openai>=1.50.0,<3",

    # YouTube integration
    "yt-dlp>=2024.0.0",

    # Vector database
    "qdrant-client>=1.12.0,<2",

    # Utilities
    "tenacity>=9.0.0,<10",
    "numpy>=2.2.0,<3",
    "scipy>=1.15.0,<2",
    "scikit-learn>=1.6.0,<2",
    "pandas>=2.2.0,<3",
    "Pillow>=11.0.0,<12",
    "tqdm>=4.67.0,<5",
    "PyYAML>=6.0.0,<7",
    "python-dotenv>=1.0.0,<2",
    "python-multipart>=0.0.19",

    # HTML parsing
    "beautifulsoup4>=4.12.0,<5",
    "lxml>=5.0.0,<6",

    # HTTP clients
    "httpx>=0.28.0,<1",
    "httpcore>=1.0.0,<2",
    "anyio>=4.7.0,<5",

    # Networking
    "certifi>=2024.12.0",
    "urllib3>=2.3.0,<3",
    "requests>=2.32.0,<3",

    # gRPC (for qdrant)
    "grpcio>=1.68.0,<2",
    "grpcio-tools>=1.68.0,<2",
    "protobuf>=5.29.0,<6",

    # Templating
    "Jinja2>=3.1.0,<4",
    "MarkupSafe>=3.0.0,<4",

    # CLI
    "click>=8.1.0,<9",
    "rich>=13.9.0,<14",

    # Validation
    "validators>=0.34.0,<1",
    "email-validator>=2.2.0,<3",

    # JSON
    "orjson>=3.10.0,<4",

    # Typing
    "typing_extensions>=4.12.0,<5",

    # MCP (Model Context Protocol)
    "fastmcp>=2.0.0,<3",
]

[project.optional-dependencies]
# ML dependencies for transcription and embedding (worker only)
ml = [
    "sentence-transformers>=3.0.0,<6",
    "faster-whisper>=1.0.0,<2",
    "transformers>=4.47.0,<5",
    # Hugging Face ecosystem (required by above)
    "huggingface-hub>=0.27.0,<1",
    "safetensors>=0.4.0,<1",
    "tokenizers>=0.21.0,<1",
]
# PDF processing dependencies
pdf = [
    "pymupdf>=1.24.0,<2",
]
# Code repository processing dependencies (Tree-sitter AST parsing)
code = [
    "tree-sitter>=0.23.0,<1",
    "tree-sitter-python>=0.23.0,<1",
    "tree-sitter-javascript>=0.23.0,<1",
    "tree-sitter-typescript>=0.23.0,<1",
    "tree-sitter-go>=0.23.0,<1",
    "tree-sitter-rust>=0.23.0,<1",
]
# Management UI dependencies
management = [
    "streamlit>=1.41.0,<2",
]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-env>=1.1.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.3.0",
    "pytest-mock>=3.14.0",
    "pytest-benchmark>=5.1.0",
    "pyright>=1.1.0",
    "responses>=0.25.0",
]

[project.scripts]
voogle-episodes = "voogle.cli.episodes:main"
voogle-management = "voogle.cli.management:main"
voogle-search = "voogle.cli.search:main"
voogle-jobs = "voogle.cli.jobs:main"
voogle-bibleproject = "voogle.bibleproject.cli:main"
voogle-mcp = "voogle.mcp.server:run_server"

[project.urls]
Repository = "https://github.com/jbraseth/voogle"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voogle"]

[dependency-groups]
# ML dependencies for transcription and embedding (worker only)
ml = [
    "sentence-transformers>=3.0.0,<6",
    "faster-whisper>=1.0.0,<2",
    "transformers>=4.47.0,<5",
    # Hugging Face ecosystem (required by above)
    "huggingface-hub>=0.27.0,<1",
    "safetensors>=0.4.0,<1",
    "tokenizers>=0.21.0,<1",
]
# PDF processing dependencies
pdf = [
    "pymupdf>=1.24.0,<2",
]
# Code repository processing dependencies (Tree-sitter AST parsing)
code = [
    "tree-sitter>=0.23.0,<1",
    "tree-sitter-python>=0.23.0,<1",
    "tree-sitter-javascript>=0.23.0,<1",
    "tree-sitter-typescript>=0.23.0,<1",
    "tree-sitter-go>=0.23.0,<1",
    "tree-sitter-rust>=0.23.0,<1",
]
# Management UI dependencies
management = [
    "streamlit>=1.41.0,<2",
]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-env>=1.1.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.3.0",
    "pytest-mock>=3.14.0",
    "pytest-benchmark>=5.1.0",
    "pyright>=1.1.0",
    "responses>=0.25.0",
]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportIncompatibleVariableOverride = "warning"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v"
